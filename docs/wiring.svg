<text x="40" y="750" font-size="14" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif" >1.  The VFD takes 400 mA (≈ 800 mA at switch-on): power it from the separate 5 V supply, never from the Arduino.</text>
<text x="40" y="772" font-size="14" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif" >2.  Only GND is shared between the supply, the display and the Arduino. UNO: don't feed the 5 V into its 5V pin.</text>
<text x="40" y="794" font-size="14" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif" >3.  Capacitors go right at the display connector (pin 1 = GND, pin 2 = +5 V). Mind the electrolytic's polarity.</text>
<text x="40" y="816" font-size="14" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif" >4.  Two displays: connect everything in parallel except E (pin 6) – left display E → D11, right display E → D6.</text>
<text x="40" y="838" font-size="14" fill="#333" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif" >5.  Keep the wires short (&lt; 20 cm), especially E. Pin numbering of the header is zig-zag, see the datasheet.</text>
</svg>