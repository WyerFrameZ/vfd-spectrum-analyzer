# Builds apploop.exe on every push and attaches it to GitHub Releases for tags v*.
name: apploop

on:
  push:
    paths: ["apploop/**", ".github/workflows/apploop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: g++ -O2 -static apploop/apploop.cpp -o apploop.exe -lole32 -lmmdevapi -luuid
      - uses: actions/upload-artifact@v4
        with:
          name: apploop
          path: apploop.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apploop.exe
